<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Rooted & Organic Interiors to schedule an interior design consultation.">
    <meta name="keywords" content="contact interior decorator, book design consultation, start interior project">
    <meta name="author" content="Rooted & Organic Interiors">
    
    <title>Rooted & Organic Interiors | Contact</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Rooted & Organic Interiors</h1>
        <nav>
            <a href="index.html" title="Home Page">Home</a>
            <a href="about.html" title="About Page">About</a>
            <a href="services.html" title="Services Page">Services</a>
            <a href="pricing.html" title="Pricing Page">Pricing</a>
            <a href="portfolio.html" title="Portfolio Page">Portfolio</a>
            <a href="contact.html" title="Contact Page">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Start Your Project</h2>
            <p>
                Ready to create a space that feels like home? Fill out the details below to schedule a consultation.
            </p>

            <form name="projectInquiry" method="post" action="contact.html">
                <fieldset>
                    <legend>Contact Information</legend>
                    
                    <label for="fullName">Your Full Name:</label>
                    <input type="text" id="fullName" name="fullName">

                    <label for="emailAddress">Email Address:</label>
                    <input type="email" id="emailAddress" name="emailAddress">
                </fieldset>

                <fieldset>
                    <legend>Project Details</legend>

                    <label for="serviceType">Service Needed:</label>
                    <select id="serviceType" name="serviceType">
                        <option value="walkthrough">Initial Walkthrough ($250)</option>
                        <option value="refresh">Single Room Refresh ($1,200)</option>
                        <option value="redesign">Full Living Space Redesign ($3,500)</option>
                    </select>

                    <label for="spaceDescription">Tell us about your space and goals:</label>
                    <textarea id="spaceDescription" name="spaceDescription" rows="5" cols="40"></textarea>
                </fieldset>

                <p>
                    <input type="submit" name="submit" value="Submit Inquiry">
                    <input type="reset" name="reset" value="Clear Form">
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rooted & Organic Interiors</p>
    </footer>

</body>
</html>
